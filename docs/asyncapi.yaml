asyncapi: 2.6.0
info:
  title: Quizy WebSocket API
  version: 0.1.0
  description: |
    AsyncAPI specification for the Quizy live quiz WebSocket API.

    The HTTP API is documented separately through OpenAPI/Swagger. This document
    describes the player WebSocket flow implemented by `app.routers.sessions`
    and `app.services.session_service`.

    Direction follows AsyncAPI semantics:
    - `publish` means the client sends a message to the backend.
    - `subscribe` means the backend sends a message to the client.
defaultContentType: application/json
servers:
  local:
    url: localhost:8001
    protocol: ws
    description: Local development server. Use `wss` behind TLS in production.
channels:
  /sessions/{join_code}/ws:
    description: |
      Player connection for a live quiz session. The socket is accepted first,
      then the client must immediately identify itself with either a `join` or
      `reconnect` JSON message.

      There are no query parameters. New joins are allowed only while the
      session status is `lobby`. Reconnect is authorized by `participant_id` and
      `guest_token` in the first message.

      No application-level heartbeat or ping-pong message is implemented in
      the backend. Reconnect behavior is based on opening a new socket and
      sending `reconnect`; if the same participant already has an open socket,
      the previous socket is closed with code `4000` and reason
      `Reconnected elsewhere`.
    parameters:
      join_code:
        $ref: '#/components/parameters/joinCode'
    bindings:
      ws:
        method: GET
    publish:
      summary: Client messages sent to the quiz session WebSocket.
      operationId: sendSessionWebSocketMessage
      message:
        oneOf:
          - $ref: '#/components/messages/Join'
          - $ref: '#/components/messages/Reconnect'
          - $ref: '#/components/messages/Answer'
    subscribe:
      summary: Server messages emitted by the quiz session WebSocket.
      operationId: receiveSessionWebSocketMessage
      message:
        oneOf:
          - $ref: '#/components/messages/ParticipantJoined'
          - $ref: '#/components/messages/Snapshot'
          - $ref: '#/components/messages/QuestionOpened'
          - $ref: '#/components/messages/AnswerAccepted'
          - $ref: '#/components/messages/LeaderboardUpdated'
          - $ref: '#/components/messages/ParticipantDisconnected'
          - $ref: '#/components/messages/SessionFinished'
          - $ref: '#/components/messages/Error'
components:
  parameters:
    joinCode:
      description: Six-character quiz session join code created by the HTTP session API.
      schema:
        type: string
        example: ABC123
  messages:
    Join:
      name: join
      title: Join as a new participant
      summary: First message for a new guest player or host observer.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerJoinEvent'
      examples:
        - name: Player join
          payload:
            type: join
            player_name: Anna
        - name: Host observer join
          summary: Inferred from implementation; host observers are not scored and are excluded from answer quorum.
          payload:
            type: join
            player_name: Host
            as_host_observer: true
    Reconnect:
      name: reconnect
      title: Reconnect existing participant
      summary: First message for a participant with saved reconnect credentials.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerReconnectEvent'
      examples:
        - name: Reconnect
          payload:
            type: reconnect
            participant_id: c28f8841-98f6-4570-9e51-897f917fb3e4
            guest_token: secret-token-from-server
    Answer:
      name: answer
      title: Submit answer
      summary: Client answer for the active question after successful join or reconnect.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerAnswerEvent'
      examples:
        - name: Single answer
          payload:
            type: answer
            question_id: 235a834e-d8cf-4320-8d8d-82d8f97e623b
            answer_option_ids:
              - d93e1e62-6a49-4407-a209-710ff0ac1ea5
    ParticipantJoined:
      name: participant_joined
      title: Participant joined
      summary: Sent after a successful join and broadcast to lobby participants.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ParticipantJoinedEvent'
      examples:
        - name: Private join response
          summary: The joining participant receives `guest_token`.
          payload:
            type: participant_joined
            session:
              id: 9cf1f0d4-6b33-45cb-a88c-df6d3b4a9201
              quiz_id: 9ab8f59d-4e8b-4303-944d-46f874ddff13
              owner_id: 7c890127-a293-42d7-bef7-35df188a6a1f
              status: lobby
              join_code: ABC123
              current_question_index: 0
              started_at: null
              finished_at: null
              created_at: '2026-04-18T10:00:00'
              updated_at: '2026-04-18T10:01:00'
            participant:
              id: c28f8841-98f6-4570-9e51-897f917fb3e4
              guest_name: Anna
              guest_token: secret-token-from-server
              status: joined
              score: 0
              joined_at: '2026-04-18T10:02:00'
              finished_at: null
              is_host: false
            participants:
              - id: c28f8841-98f6-4570-9e51-897f917fb3e4
                guest_name: Anna
                status: joined
                score: 0
                joined_at: '2026-04-18T10:02:00'
                finished_at: null
                is_host: false
    Snapshot:
      name: snapshot
      title: Participant snapshot
      summary: Sent privately after successful reconnect.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SnapshotEvent'
      examples:
        - name: Live reconnect snapshot
          payload:
            type: snapshot
            session:
              id: 9cf1f0d4-6b33-45cb-a88c-df6d3b4a9201
              quiz_id: 9ab8f59d-4e8b-4303-944d-46f874ddff13
              owner_id: 7c890127-a293-42d7-bef7-35df188a6a1f
              status: live
              join_code: ABC123
              current_question_index: 1
              started_at: '2026-04-18T10:30:00'
              finished_at: null
              created_at: '2026-04-18T10:00:00'
              updated_at: '2026-04-18T10:30:00'
            participant:
              id: c28f8841-98f6-4570-9e51-897f917fb3e4
              guest_name: Anna
              guest_token: secret-token-from-server
              status: in_progress
              score: 1
              joined_at: '2026-04-18T10:02:00'
              finished_at: null
              is_host: false
            question:
              id: 235a834e-d8cf-4320-8d8d-82d8f97e623b
              question_text: Which answer is correct?
              question_type: single_answer
              order_index: 1
              answer_time: 30
              points_for_correct_answer: 1
              points_for_incorrect_answer: 0
              hint: null
              image_url: null
              answer_window:
                started_at: '2026-04-18T10:30:00'
                answer_time_seconds: 30
                grace_period_seconds: 5
                ends_at: '2026-04-18T10:30:30'
                accepts_until: '2026-04-18T10:30:35'
                server_time: '2026-04-18T10:30:03'
              answers:
                - id: d93e1e62-6a49-4407-a209-710ff0ac1ea5
                  answer_text: Answer A
            has_answered: false
            leaderboard: null
    QuestionOpened:
      name: question_opened
      title: Question opened
      summary: Sent when the admin starts the session or advances to the next question.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/QuestionOpenedEvent'
    AnswerAccepted:
      name: answer_accepted
      title: Answer accepted
      summary: Private confirmation for the player whose answer was accepted.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AnswerAcceptedEvent'
    LeaderboardUpdated:
      name: leaderboard_updated
      title: Leaderboard updated
      summary: Broadcast after all active players answer or when the admin advances.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LeaderboardUpdatedEvent'
    ParticipantDisconnected:
      name: participant_disconnected
      title: Participant disconnected
      summary: Broadcast after a connected participant disconnects.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ParticipantDisconnectedEvent'
    SessionFinished:
      name: session_finished
      title: Session finished
      summary: Broadcast when the admin ends the session or the quiz reaches the end.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionFinishedEvent'
    Error:
      name: error
      title: Error
      summary: Sent when the backend rejects an initial message or later client event.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ErrorEvent'
      examples:
        - name: Unsupported message type
          payload:
            type: error
            detail: Unsupported event type
        - name: Validation error
          payload:
            type: error
            detail:
              - type: missing
                loc:
                  - player_name
                msg: Field required
                input:
                  type: join
  schemas:
    PlayerJoinEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - player_name
      properties:
        type:
          type: string
          enum:
            - join
        player_name:
          type: string
          minLength: 1
          maxLength: 255
        as_host_observer:
          type: boolean
          default: false
          description: Admin dashboard observer only; not scored and excluded from answer quorum.
    PlayerReconnectEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - participant_id
        - guest_token
      properties:
        type:
          type: string
          enum:
            - reconnect
        participant_id:
          type: string
          format: uuid
        guest_token:
          type: string
          minLength: 1
          maxLength: 255
          description: Secret token returned in the private `participant_joined` response.
    PlayerAnswerEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - question_id
        - answer_option_ids
      properties:
        type:
          type: string
          enum:
            - answer
        question_id:
          type: string
          format: uuid
        answer_option_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: For `single_answer`, exactly one id is required. For `multiple_answer`, one or more ids are allowed.
    SessionSummary:
      type: object
      required:
        - id
        - quiz_id
        - status
        - current_question_index
      properties:
        id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - created
            - lobby
            - live
            - paused
            - finished
            - cancelled
        join_code:
          type: string
          nullable: true
        current_question_index:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PublicParticipant:
      type: object
      required:
        - id
        - guest_name
        - status
        - score
        - is_host
      properties:
        id:
          type: string
          format: uuid
        guest_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - joined
            - ready
            - in_progress
            - finished
            - disconnected
        score:
          type: integer
        joined_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        is_host:
          type: boolean
    PrivateParticipant:
      allOf:
        - $ref: '#/components/schemas/PublicParticipant'
        - type: object
          required:
            - guest_token
          properties:
            guest_token:
              type: string
              description: Secret reconnect token. Present only in private join/reconnect responses.
    Participant:
      oneOf:
        - $ref: '#/components/schemas/PublicParticipant'
        - $ref: '#/components/schemas/PrivateParticipant'
    PlayerAnswerOption:
      type: object
      required:
        - id
        - answer_text
      properties:
        id:
          type: string
          format: uuid
        answer_text:
          type: string
    PlayerAnswerWindow:
      type: object
      required:
        - answer_time_seconds
        - grace_period_seconds
        - server_time
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
        answer_time_seconds:
          type: integer
        grace_period_seconds:
          type: integer
          description: Inferred from implementation; currently 5 seconds.
        ends_at:
          type: string
          format: date-time
          nullable: true
        accepts_until:
          type: string
          format: date-time
          nullable: true
        server_time:
          type: string
          format: date-time
    PlayerQuestion:
      type: object
      required:
        - id
        - question_text
        - question_type
        - order_index
        - points_for_correct_answer
        - points_for_incorrect_answer
        - answers
      properties:
        id:
          type: string
          format: uuid
        question_text:
          type: string
        question_type:
          type: string
          enum:
            - single_answer
            - multiple_answer
        order_index:
          type: integer
        answer_time:
          type: integer
          nullable: true
        points_for_correct_answer:
          type: integer
        points_for_incorrect_answer:
          type: integer
        hint:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        answer_window:
          $ref: '#/components/schemas/PlayerAnswerWindow'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PlayerAnswerOption'
          description: Correct-answer flags are intentionally omitted from WebSocket question payloads.
    LeaderboardEntry:
      type: object
      required:
        - rank
        - participant_id
        - score
        - last_points
      properties:
        rank:
          type: integer
        participant_id:
          type: string
          format: uuid
        guest_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        score:
          type: integer
        last_points:
          type: integer
        last_answer_correct:
          type: boolean
          nullable: true
        answered_at:
          type: string
          format: date-time
          nullable: true
    ParticipantJoinedEvent:
      type: object
      required:
        - type
        - session
        - participant
        - participants
      properties:
        type:
          type: string
          enum:
            - participant_joined
        session:
          $ref: '#/components/schemas/SessionSummary'
        participant:
          $ref: '#/components/schemas/Participant'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicParticipant'
    SnapshotEvent:
      type: object
      required:
        - type
        - session
        - participant
        - question
        - has_answered
        - leaderboard
      properties:
        type:
          type: string
          enum:
            - snapshot
        session:
          $ref: '#/components/schemas/SessionSummary'
        participant:
          $ref: '#/components/schemas/PrivateParticipant'
        question:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlayerQuestion'
        has_answered:
          type: boolean
        leaderboard:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeaderboardUpdatedEvent'
          description: Most recent leaderboard payload, if one has already been emitted.
    QuestionOpenedEvent:
      type: object
      required:
        - type
        - session
        - question
        - participants
      properties:
        type:
          type: string
          enum:
            - question_opened
        session:
          $ref: '#/components/schemas/SessionSummary'
        question:
          $ref: '#/components/schemas/PlayerQuestion'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicParticipant'
    AnswerAcceptedEvent:
      type: object
      required:
        - type
        - session
        - participants
      properties:
        type:
          type: string
          enum:
            - answer_accepted
        session:
          $ref: '#/components/schemas/SessionSummary'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicParticipant'
    LeaderboardUpdatedEvent:
      type: object
      required:
        - type
        - session
        - question_id
        - question_order_index
        - delay_seconds
        - entries
      properties:
        type:
          type: string
          enum:
            - leaderboard_updated
        session:
          $ref: '#/components/schemas/SessionSummary'
        question_id:
          type: string
          format: uuid
        question_order_index:
          type: integer
        delay_seconds:
          type: integer
          description: Backend delay before broadcasting the following question or finish event when payloads are sent together.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    ParticipantDisconnectedEvent:
      type: object
      required:
        - type
        - participant
      properties:
        type:
          type: string
          enum:
            - participant_disconnected
        participant:
          $ref: '#/components/schemas/PublicParticipant'
    SessionFinishedEvent:
      type: object
      required:
        - type
        - session
        - participants
        - leaderboard
      properties:
        type:
          type: string
          enum:
            - session_finished
        session:
          $ref: '#/components/schemas/SessionSummary'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicParticipant'
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    ErrorEvent:
      type: object
      required:
        - type
        - detail
      properties:
        type:
          type: string
          enum:
            - error
        detail:
          description: String for HTTPException errors; array/object for Pydantic validation errors.
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
