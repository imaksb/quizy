PublicParticipant:
  type: object
  additionalProperties: false
  required:
    - id
    - guest_name
    - status
    - score
    - is_host
  properties:
    id:
      type: string
      format: uuid
    guest_name:
      type: string
      nullable: true
    status:
      type: string
      enum:
        - joined
        - ready
        - in_progress
        - finished
        - disconnected
    score:
      type: integer
    joined_at:
      type: string
      format: date-time
      nullable: true
    finished_at:
      type: string
      format: date-time
      nullable: true
    is_host:
      type: boolean

PrivateParticipant:
  type: object
  additionalProperties: false
  required:
    - id
    - guest_name
    - status
    - score
    - is_host
    - guest_token
  properties:
    id:
      type: string
      format: uuid
    guest_name:
      type: string
      nullable: true
    status:
      type: string
      enum:
        - joined
        - ready
        - in_progress
        - finished
        - disconnected
    score:
      type: integer
    joined_at:
      type: string
      format: date-time
      nullable: true
    finished_at:
      type: string
      format: date-time
      nullable: true
    is_host:
      type: boolean
    guest_token:
      type: string
      description: Secret reconnect token. Present only in private join/reconnect responses.

Participant:
  oneOf:
    - $ref: '#/components/schemas/PublicParticipant'
    - $ref: '#/components/schemas/PrivateParticipant'